name: pages

on:
  push:
    branches: [main]
    paths: ["reports/valuation.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # The report now lives on emiliensabathier.fr: publish a redirect (also as 404.html for old sub-paths).
      - run: |
          mkdir site
          url="https://emiliensabathier.fr/labs/${{ github.event.repository.name }}/"
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Moved</title>
          <link rel="canonical" href="$url">
          <meta http-equiv="refresh" content="0; url=$url">
          </head><body><p>This report moved to <a href="$url">$url</a>.</p></body></html>
          EOF
          cp site/index.html site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
